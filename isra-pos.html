<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A64F0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="الإسراء POS" />
<title>الإسراء — نقطة بيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" id="manifest-link" href="data:application/manifest+json,{}">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
:root {
  --blue: #0A64F0; --blue-hover: #0852c8; --blue-light: #e8f0fe;
  --white: #ffffff; --silver: #C0C6CF; --silver-light: #f5f6f8;
  --silver-border: #e4e7eb; --gold: #C9A227; --gold-light: #fbf5e0;
  --text: #1a1d21; --text-muted: #5f6368;
  --danger: #d93025; --danger-light: #fce8e6;
  --success: #1e8e3e; --success-light: #e6f4ea;
  --radius-sm: 8px; --radius-md: 14px; --radius-lg: 22px; --radius-xl: 32px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.04);
  --transition: all .18s cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  background: var(--silver-light); color: var(--text);
  font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

.app-shell { display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }
.sidebar { background: var(--blue); color: #fff; display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 12px 12px 24px; border-bottom: 1px solid rgba(255,255,255,.15); margin-bottom: 12px; }
.brand-logo { width: 44px; height: 44px; border-radius: 14px; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: var(--blue); flex-shrink: 0; }
.brand-text h1 { font-size: 17px; font-weight: 700; }
.brand-text p { font-size: 11.5px; opacity: .7; margin-top: 1px; }
.nav-list { display: flex; flex-direction: column; gap: 4px; list-style: none; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 100px; color: rgba(255,255,255,.85); font-size: 13.5px; font-weight: 500; cursor: pointer; transition: var(--transition); text-align: right; width: 100%; font-family: inherit; }
.nav-item:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav-item.active { background: #fff; color: var(--blue); font-weight: 600; }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }

.main { overflow-y: auto; padding: 28px 32px; height: 100vh; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
.page-header h2 { font-size: 26px; font-weight: 700; }
.page-header .sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin-bottom: 32px; }
.home-tile { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 12px; background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); transition: var(--transition); cursor: pointer; border: 1px solid var(--silver-border); font-family: inherit; color: var(--text); }
.home-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--blue-light); }
.tile-circle { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; transition: var(--transition); }
.tile-circle svg { width: 32px; height: 32px; }
.tile-label { font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.3; }
.c-blue { background: var(--blue); }
.c-gold { background: var(--gold); color: var(--blue); }
.c-silver { background: var(--silver); color: var(--text); }
.c-success { background: var(--success); }
.c-danger { background: var(--danger); }
.c-dark { background: #1a1d21; }
.c-purple { background: #8B5CF6; }

.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--white); border-radius: var(--radius-lg); padding: 20px 22px; box-shadow: var(--shadow-sm); border: 1px solid var(--silver-border); display: flex; flex-direction: column; gap: 6px; }
.stat-card .lbl { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.stat-card .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-card .val.gold { color: var(--gold); }
.stat-card .val.blue { color: var(--blue); }
.stat-card .val.success { color: var(--success); }
.stat-card .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.btn { height: 42px; padding: 0 22px; border-radius: 100px; font-family: inherit; font-size: 13.5px; font-weight: 600; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--blue); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--blue-hover); box-shadow: var(--shadow-md); }
.btn-primary:disabled { background: var(--silver); cursor: not-allowed; }
.btn-gold { background: var(--gold); color: var(--blue); font-weight: 700; }
.btn-gold:hover { filter: brightness(1.05); }
.btn-outline { background: var(--white); color: var(--text); border: 1px solid var(--silver); }
.btn-outline:hover { background: var(--silver-light); border-color: var(--blue); color: var(--blue); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { height: 34px; padding: 0 16px; font-size: 12.5px; }
.btn-sm svg { width: 15px; height: 15px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); transition: var(--transition); }
.icon-btn:hover { background: var(--silver-light); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

.form-group { display: flex; flex-direction: column; gap: 14px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
.form-field input, .form-field select, .form-field textarea { padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid var(--silver-border); background: var(--white); color: var(--text); font-size: 14px; transition: var(--transition); }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row.three { grid-template-columns: 1fr 1fr 1fr; }

.table-wrap { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--silver-border); overflow: hidden; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table thead th { background: var(--silver-light); padding: 13px 16px; text-align: right; font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--silver-border); white-space: nowrap; }
.data-table tbody td { padding: 13px 16px; border-bottom: 1px solid var(--silver-border); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: var(--silver-light); }
.data-table .r { text-align: left; font-variant-numeric: tabular-nums; }

.badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-size: 11.5px; font-weight: 600; }
.badge.ok { background: var(--success-light); color: var(--success); }
.badge.warn { background: var(--gold-light); color: var(--gold); }
.badge.bad { background: var(--danger-light); color: var(--danger); }
.badge.info { background: var(--blue-light); color: var(--blue); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; backdrop-filter: blur(2px); }
.modal-backdrop.open { display: flex; }
.modal { background: var(--white); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 28px; }
.modal.lg { max-width: 780px; }
.modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.modal .hint { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-start; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--silver-border); }

.invoice-builder { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
.invoice-items-table { background: var(--white); border-radius: var(--radius-md); border: 1px solid var(--silver-border); overflow: hidden; }
.invoice-items-table table { width: 100%; border-collapse: collapse; }
.invoice-items-table th { background: var(--silver-light); padding: 10px 12px; font-size: 11.5px; color: var(--text-muted); font-weight: 700; text-align: right; }
.invoice-items-table td { padding: 8px 12px; border-top: 1px solid var(--silver-border); }
.invoice-items-table input { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--silver-border); width: 100%; font-size: 13px; }
.invoice-items-table input:focus { outline: none; border-color: var(--blue); }
.invoice-summary { background: var(--white); border-radius: var(--radius-md); border: 1px solid var(--silver-border); padding: 20px; position: sticky; top: 0; height: fit-content; }
.summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13.5px; color: var(--text-muted); }
.summary-row.total { padding: 14px 0; margin-top: 8px; border-top: 2px solid var(--gold); font-size: 19px; font-weight: 700; color: var(--text); }
.summary-row.total .amount { color: var(--gold); }

.search-bar { display: flex; gap: 8px; align-items: center; background: var(--white); border: 1px solid var(--silver-border); border-radius: 100px; padding: 6px 16px; max-width: 400px; flex: 1; }
.search-bar input { border: none; outline: none; background: transparent; font-size: 13.5px; flex: 1; padding: 6px 0; }
.search-bar svg { color: var(--text-muted); width: 18px; height: 18px; }

.toast-container { position: fixed; bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 2000; }
.toast { background: var(--text); color: #fff; padding: 14px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); font-size: 13.5px; font-weight: 500; animation: slideIn .25s ease-out; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============ Scanner overlay ============ */
#scanner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 3000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
#scanner-overlay.open { display: flex; }
#scanner-video { max-width: 100%; max-height: 70vh; border-radius: 16px; border: 3px solid var(--gold); }
.scanner-close { position: absolute; top: 20px; left: 20px; width: 48px; height: 48px; border-radius: 50%; background: #fff; color: #000; font-size: 24px; cursor: pointer; }
.scanner-title { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 16px; }

/* ============ Thermal print ============ */
#thermal-area { display: none; }
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area *, #thermal-area, #thermal-area * { visibility: visible; }
  #print-area { display: block !important; position: fixed; inset: 0; background: #fff; padding: 15mm; color: #000; }
  #thermal-area { display: block !important; position: fixed; inset: 0; background: #fff; color: #000; padding: 5mm; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.5; width: 80mm; }
  #thermal-area .th-center { text-align: center; }
  #thermal-area .th-line { border-top: 1px dashed #000; margin: 4px 0; }
  #thermal-area .th-row { display: flex; justify-content: space-between; }
  #thermal-area .th-bold { font-weight: bold; }
  #thermal-area .th-big { font-size: 14px; font-weight: bold; }
  @page { size: A4; margin: 15mm; }
}
@media print and (max-width: 0px) {
  @page { size: 80mm auto; margin: 0; }
}
.invoice-print { font-family: 'Rubik', sans-serif; direction: rtl; color: #000; font-size: 12px; line-height: 1.7; }
.invoice-print .ip-header { display: flex; justify-content: space-between; align-items: start; padding-bottom: 16px; border-bottom: 3px solid var(--blue); margin-bottom: 20px; }
.invoice-print .ip-shop h1 { font-size: 22px; font-weight: 800; color: var(--blue); margin-bottom: 4px; }
.invoice-print .ip-shop p { font-size: 11px; color: #555; }
.invoice-print .ip-meta { text-align: left; font-size: 11.5px; }
.invoice-print .ip-meta strong { color: var(--blue); font-size: 15px; display: block; margin-bottom: 4px; }
.invoice-print .ip-party { background: #f5f6f8; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 11.5px; }
.invoice-print table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.invoice-print th { background: var(--blue); color: #fff; padding: 10px; text-align: right; font-size: 11px; }
.invoice-print td { padding: 9px 10px; border-bottom: 1px solid #e4e7eb; font-size: 11.5px; }
.invoice-print .ip-totals { width: 320px; margin-right: auto; background: #f5f6f8; padding: 14px 18px; border-radius: 8px; }
.invoice-print .ip-totals .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; }
.invoice-print .ip-totals .row.total { border-top: 2px solid var(--gold); margin-top: 6px; padding-top: 10px; font-size: 16px; font-weight: 800; color: var(--blue); }
.invoice-print .ip-footer { margin-top: 30px; text-align: center; font-size: 11px; color: #666; border-top: 1px dashed var(--silver); padding-top: 12px; }

.barcode-box { text-align: center; padding: 8px 0; }
.barcode-box svg { max-width: 100%; }

kbd { background: var(--silver-light); padding: 3px 8px; border-radius: 6px; font-family: monospace; font-size: 12px; border: 1px solid var(--silver); }

/* Notifications badge */
.notif-badge { position: fixed; top: 20px; left: 20px; background: var(--danger); color: #fff; padding: 12px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); z-index: 1500; animation: slideIn .3s ease-out; cursor: pointer; }

/* Reports tabs */
.report-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.report-tab { padding: 8px 18px; border-radius: 100px; border: 1px solid var(--silver-border); background: var(--white); font-family: inherit; font-size: 13px; cursor: pointer; transition: var(--transition); }
.report-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }

@media (max-width: 1024px) {
  .app-shell { grid-template-columns: 72px 1fr; }
  .brand-text, .nav-item span { display: none; }
  .nav-item { justify-content: center; padding: 12px; }
  .invoice-builder { grid-template-columns: 1fr; }
  .main { padding: 20px; }
}
@media (max-width: 640px) {
  .form-row, .form-row.three { grid-template-columns: 1fr; }
  .stats-row, .home-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
</style>
</head>
<body>

<div id="app"></div>
<div id="modal-root"></div>
<div id="print-area"></div>
<div id="thermal-area"></div>

<div id="scanner-overlay">
  <button class="scanner-close" id="scanner-close">✕</button>
  <div class="scanner-title">وجّه الباركود نحو الكاميرا</div>
  <video id="scanner-video" autoplay playsinline></video>
</div>

<script>
/* ============================================================
   الإسراء POS v2.0 — كل الميزات في ملف واحد
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const fmtMoney = (n, cur = 'د.م.') => (Number(n) || 0).toLocaleString('ar-MA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + cur;
const fmtDate = (iso) => new Date(iso).toLocaleString('ar-MA', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtDateShort = (iso) => new Date(iso).toLocaleDateString('ar-MA', { year: 'numeric', month: '2-digit', day: '2-digit' });
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============ DB ============ */
const DB_KEY = 'isra_pos_v2';
const DEFAULT_DB = {
  version: 2,
  settings: {
    shopName: 'الإسراء', phone: '05 22 00 00 00', address: 'شارع محمد الخامس، الدار البيضاء',
    currency: 'د.م.', taxRate: 0.20, invoicePrefix: 'INV-',
    notificationsEnabled: false, thermalWidth: 80
  },
  products: [
    { id: 'p1', name: 'زيت المائدة 5 لتر', barcode: '6111111111111', category: 'زيوت', buyPrice: 65, sellPrice: 85, quantity: 40, minStock: 10 },
    { id: 'p2', name: 'سكر 1 كغ', barcode: '6111111111112', category: 'مواد غذائية', buyPrice: 7, sellPrice: 10, quantity: 120, minStock: 30 },
    { id: 'p3', name: 'شاي أخضر 200غ', barcode: '6111111111113', category: 'مشروبات', buyPrice: 20, sellPrice: 28, quantity: 55, minStock: 15 },
    { id: 'p4', name: 'دقيق 5 كغ', barcode: '6111111111114', category: 'مواد غذائية', buyPrice: 25, sellPrice: 35, quantity: 8, minStock: 20 },
    { id: 'p5', name: 'أرز 1 كغ', barcode: '6111111111115', category: 'مواد غذائية', buyPrice: 9, sellPrice: 14, quantity: 85, minStock: 20 }
  ],
  customers: [
    { id: 'c1', name: 'محمد العلمي', phone: '0661111111', address: 'الدار البيضاء', balance: 250 },
    { id: 'c2', name: 'فاطمة الزهراء', phone: '0662222222', address: 'الرباط', balance: 0 }
  ],
  suppliers: [
    { id: 's1', name: 'شركة الأمل للتوزيع', phone: '0522111111', address: 'الدار البيضاء', balance: 1200 }
  ],
  invoices: [],
  users: [{ id: 'u1', username: 'admin', displayName: 'المدير', pin: '0000', role: 'admin' }]
};
let db = null;

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) { db = JSON.parse(JSON.stringify(DEFAULT_DB)); saveDB(); return; }
    db = JSON.parse(raw);
    if (!db.users?.length) db.users = DEFAULT_DB.users;
    if (!db.settings) db.settings = DEFAULT_DB.settings;
  } catch { db = JSON.parse(JSON.stringify(DEFAULT_DB)); }
}
function saveDB() { try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) { console.error(e); } }

function getSession() { try { const r = localStorage.getItem('isra_session'); return r ? JSON.parse(r) : null; } catch { return null; } }
function setSession(u) { localStorage.setItem('isra_session', JSON.stringify(u)); }
function clearSession() { localStorage.removeItem('isra_session'); }
function can(p) {
  const u = getSession(); if (!u) return false;
  if (u.role === 'admin') return true;
  const perms = { cashier: ['sales:create','sales:view','invoices:view','invoices:print','products:view','customers:view'], viewer: ['sales:view','invoices:view','products:view'] };
  return (perms[u.role] || []).includes(p);
}

/* ============ Toast ============ */
function toast(msg, type = 'success') {
  let c = $('.toast-container');
  if (!c) { c = document.createElement('div'); c.className = 'toast-container'; document.body.appendChild(c); }
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  c.appendChild(el); setTimeout(() => el.remove(), 3200);
}

/* ============ Modal ============ */
function openModal(html, size = '') {
  $('#modal-root').innerHTML = `<div class="modal-backdrop open" id="mb"><div class="modal ${size}">${html}</div></div>`;
  $('#mb').addEventListener('click', (e) => { if (e.target === $('#mb')) closeModal(); });
}
function closeModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ============ Notifications ============ */
async function requestNotificationPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}
function notifyLowStock() {
  if (!db.settings.notificationsEnabled) return;
  const low = db.products.filter(p => p.quantity <= p.minStock);
  if (!low.length) return;
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('⚠️ تنبيه المخزون - الإسراء', {

      tag: 'low-stock', requireInteraction: false
    });
  }
  // في الصفحة
  const existing = $('#notif-badge');

  badge.onclick = () => navigate('dashboard');
  document.body.appendChild(badge);
  setTimeout(() => badge.remove(), 10000);
}

/* ============ Barcode Scanner ============ */
let scannerInstance = null;
let scannerStream = null;

async function openScanner(onResult) {
  const overlay = $('#scanner-overlay');
  const video = $('#scanner-video');
  overlay.classList.add('open');

  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scannerStream;

    if (typeof ZXing !== 'undefined') {
      const codeReader = new ZXing.BrowserMultiFormatReader();
      scannerInstance = codeReader;
      codeReader.decodeFromVideoDevice(null, video, (result, err) => {
        if (result) {
          const code = result.getText();
          closeScanner();
          if (onResult) onResult(code);
        }
      });
    } else {
      toast('مكتبة المسح غير متاحة', 'error');
      closeScanner();
    }
  } catch (err) {
    toast('لا يمكن الوصول للكاميرا: ' + err.message, 'error');
    closeScanner();
  }
}

function closeScanner() {
  const overlay = $('#scanner-overlay');
  overlay.classList.remove('open');
  if (scannerStream) { scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
  if (scannerInstance) { try { scannerInstance.reset(); } catch {} scannerInstance = null; }
}
$('#scanner-close').addEventListener('click', closeScanner);

function render() {
  const session = getSession();
  if (!session) return renderLogin();

  const visibleRoutes = Object.keys(ROUTES).filter(k => {
    if (k === 'users' || k === 'settings') return session.role === 'admin';
    if (k === 'excel') return session.role === 'admin';
    return true;
  });

  $('#app').innerHTML = `
    <div class="app-shell">

  $('[data-logout]').addEventListener('click', () => { if (confirm('خروج؟')) { clearSession(); render(); } });

  const main = $('#main-content');
  switch (currentRoute) {
    case 'home': renderHome(main); break;

    case 'reports': renderReports(main); break;

    case 'excel': renderExcel(main); break;
    case 'backup': renderBackup(main); break;
    case 'users': renderUsers(main); break;
    case 'settings': renderSettings(main); break;
  }
}

    const p = invoices.filter(x => x.type === 'purchase' && x.date.startsWith(key));
    days.push({ label: d.toLocaleDateString('ar-MA', { weekday: 'short' }), sales: s.reduce((a, x) => a + x.total, 0), purchases: p.reduce((a, x) => a + x.total, 0) });
  }

  const productSales = {};
  invoices.filter(i => i.type === 'sale').forEach(inv => {
    inv.items.forEach(it => {
      if (!productSales[it.productId]) productSales[it.productId] = { name: it.name, qty: 0, revenue: 0 };
      productSales[it.productId].qty += it.quantity;
      productSales[it.productId].revenue += it.total;
    });
  });
  const topProducts = Object.values(productSales).sort((a, b) => b.revenue - a.revenue).slice(0, 5);

  const totalSales = invoices.filter(i => i.type === 'sale').reduce((s, x) => s + x.total, 0);
  const totalPurchases = invoices.filter(i => i.type === 'purchase').reduce((s, x) => s + x.total, 0);
  const pendingDue = invoices.filter(i => i.type === 'sale').reduce((s, x) => s + x.due, 0);
  const profit = totalSales - totalPurchases;

  const maxVal = Math.max(...days.map(d => Math.max(d.sales, d.purchases)), 1);
  const chartW = 700, chartH = 240, barW = chartW / (days.length * 3);
  const barsSvg = days.map((d, i) => {
    const gx = i * (barW * 3);
    const sh = (d.sales / maxVal) * (chartH - 40);
    const ph = (d.purchases / maxVal) * (chartH - 40);
    return `<g>
      <rect x="${gx + barW * 0.2}" y="${chartH - sh}" width="${barW}" height="${sh}" fill="#0A64F0" rx="4"/>
      <rect x="${gx + barW * 1.3}" y="${chartH - ph}" width="${barW}" height="${ph}" fill="#C9A227" rx="4"/>
      <text x="${gx + barW * 1}" y="${chartH + 16}" font-size="10" fill="#5f6368" text-anchor="middle">${d.label}</text>
    </g>`;
  }).join('');

  container.innerHTML = `
    <div class="page-header"><div><h2>لوحة التحكم</h2><p class="sub">نظرة شاملة على الأداء</p></div></div>
    <div class="stats-row">
      <div class="stat-card"><span class="lbl">إجمالي المبيعات</span><span class="val blue">${fmtMoney(totalSales, db.settings.currency)}</span><span class="sub">${invoices.filter(i => i.type === 'sale').length} فاتورة</span></div>
      <div class="stat-card"><span class="lbl">إجمالي المشتريات</span><span class="val gold">${fmtMoney(totalPurchases, db.settings.currency)}</span><span class="sub">${invoices.filter(i => i.type === 'purchase').length} فاتورة</span></div>
      <div class="stat-card"><span class="lbl">صافي الربح</span><span class="val ${profit >= 0 ? 'success' : ''}" style="${profit < 0 ? 'color:var(--danger)' : ''}">${fmtMoney(profit, db.settings.currency)}</span></div>
      <div class="stat-card"><span class="lbl">مبالغ غير محصلة</span><span class="val" style="color:var(--gold)">${fmtMoney(pendingDue, db.settings.currency)}</span></div>
    </div>
    <div style="background:#fff;border-radius:var(--radius-lg);padding:24px;margin-bottom:24px;box-shadow:var(--shadow-sm);border:1px solid var(--silver-border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 style="font-size:16px;font-weight:700">آخر 7 أيام</h3>
        <div style="display:flex;gap:16px;font-size:12px">
          <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;background:#0A64F0;border-radius:3px"></span>مبيعات</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;background:#C9A227;border-radius:3px"></span>مشتريات</span>
        </div>
      </div>
      <svg viewBox="0 0 ${chartW} ${chartH + 30}" style="width:100%;height:auto;max-height:280px">
        <line x1="0" y1="${chartH}" x2="${chartW}" y2="${chartH}" stroke="#e4e7eb"/>
        ${barsSvg}
      </svg>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div style="background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--silver-border)">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">أعلى المنتجات</h3>
        ${topProducts.length ? topProducts.map((p, i) => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--silver-border)">
          <div style="width:28px;height:28px;border-radius:50%;background:${i === 0 ? 'var(--gold)' : 'var(--blue-light)'};color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">${i + 1}</div>
          <div style="flex:1"><div style="font-weight:600;font-size:13.5px">${esc(p.name)}</div><div style="font-size:11.5px;color:var(--text-muted)">${p.qty} وحدة</div></div>
          <div style="font-weight:700;color:var(--blue)">${fmtMoney(p.revenue, db.settings.currency)}</div>
        </div>`).join('') : '<p style="color:var(--text-muted);font-size:13px">لا توجد مبيعات</p>'}
      </div>
      <div style="background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--silver-border)">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">تنبيهات المخزون</h3>
        ${products.filter(p => p.quantity <= p.minStock).length ? products.filter(p => p.quantity <= p.minStock).map(p => `<div style="padding:10px 0;border-bottom:1px solid var(--silver-border);font-size:13px">
          <div style="font-weight:600;color:var(--danger)">⚠️ ${esc(p.name)}</div>
          <div style="font-size:11.5px;color:var(--text-muted)">الكمية: ${p.quantity} — الحد: ${p.minStock}</div>
        </div>`).join('') : '<p style="color:var(--success);font-size:13px">✓ كل المخزون جيد</p>'}
      </div>
    </div>
  `;
}

/* ============ Reports (Advanced) ============ */
let reportRange = 'month';
let reportType = 'sales';

function renderReports(container) {
  const now = new Date();
  let from, to, label;

  if (reportRange === 'today') {
    from = to = new Date().toISOString().slice(0, 10);
    label = 'اليوم';
  } else if (reportRange === 'week') {
    const d = new Date(); d.setDate(d.getDate() - 6);
    from = d.toISOString().slice(0, 10); to = new Date().toISOString().slice(0, 10);
    label = 'آخر 7 أيام';
  } else if (reportRange === 'month') {
    from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
    to = new Date().toISOString().slice(0, 10);
    label = 'هذا الشهر';
  } else if (reportRange === 'year') {
    from = new Date(now.getFullYear(), 0, 1).toISOString().slice(0, 10);
    to = new Date().toISOString().slice(0, 10);
    label = 'هذه السنة';
  } else {
    from = $('#rep-from')?.value || new Date().toISOString().slice(0, 10);
    to = $('#rep-to')?.value || new Date().toISOString().slice(0, 10);
    label = 'مخصص';
  }

  const inRange = db.invoices.filter(i => {
    const d = i.date.slice(0, 10);
    return d >= from && d <= to && i.type === reportType;
  });

  const total = inRange.reduce((s, i) => s + i.total, 0);
  const paid = inRange.reduce((s, i) => s + i.paid, 0);
  const due = inRange.reduce((s, i) => s + i.due, 0);
  const tax = inRange.reduce((s, i) => s + i.tax, 0);

  // تجميع حسب الطرف
  const byParty = {};
  inRange.forEach(i => {
    if (!byParty[i.partyId]) byParty[i.partyId] = { name: i.partyName, count: 0, total: 0, due: 0 };
    byParty[i.partyId].count++;
    byParty[i.partyId].total += i.total;
    byParty[i.partyId].due += i.due;
  });

  // تجميع حسب المنتج
  const byProduct = {};
  inRange.forEach(i => {
    i.items.forEach(it => {
      if (!byProduct[it.productId]) byProduct[it.productId] = { name: it.name, qty: 0, revenue: 0 };
      byProduct[it.productId].qty += it.quantity;
      byProduct[it.productId].revenue += it.total;
    });
  });

  const partyList = Object.values(byParty).sort((a, b) => b.total - a.total);
  const productList = Object.values(byProduct).sort((a, b) => b.revenue - a.revenue);

  container.innerHTML = `
    <div class="page-header">
      <div><h2>التقارير</h2><p class="sub">${label} (${from} → ${to})</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" id="exp-pdf">📄 PDF</button>
        <button class="btn btn-gold" id="exp-xls">📊 Excel</button>
      </div>
    </div>

    <div class="report-tabs">
      ${['today', 'week', 'month', 'year', 'custom'].map(r => `<button class="report-tab ${reportRange === r ? 'active' : ''}" data-r="${r}">${r === 'today' ? 'اليوم' : r === 'week' ? 'أسبوع' : r === 'month' ? 'شهر' : r === 'year' ? 'سنة' : 'مخصص'}</button>`).join('')}
      ${reportRange === 'custom' ? `<input type="date" id="rep-from" value="${from}" style="padding:8px 12px;border-radius:100px;border:1px solid var(--silver-border);font-family:inherit">
        <input type="date" id="rep-to" value="${to}" style="padding:8px 12px;border-radius:100px;border:1px solid var(--silver-border);font-family:inherit">` : ''}
    </div>

    <div class="report-tabs">
      <button class="report-tab ${reportType === 'sale' ? 'active' : ''}" data-t="sale">فواتير البيع</button>
      <button class="report-tab ${reportType === 'purchase' ? 'active' : ''}" data-t="purchase">فواتير الشراء</button>
    </div>

    <div class="stats-row">
      <div class="stat-card"><span class="lbl">عدد الفواتير</span><span class="val">${inRange.length}</span></div>
      <div class="stat-card"><span class="lbl">الإجمالي</span><span class="val blue">${fmtMoney(total, db.settings.currency)}</span></div>
      <div class="stat-card"><span class="lbl">المدفوع</span><span class="val success">${fmtMoney(paid, db.settings.currency)}</span></div>
      <div class="stat-card"><span class="lbl">المتبقي</span><span class="val gold">${fmtMoney(due, db.settings.currency)}</span></div>
      <div class="stat-card"><span class="lbl">الضريبة</span><span class="val">${fmtMoney(tax, db.settings.currency)}</span></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div style="background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--silver-border)">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">حسب ${reportType === 'sale' ? 'العميل' : 'المورد'}</h3>
        ${partyList.length ? `<table class="data-table"><thead><tr><th>الطرف</th><th class="r">فواتير</th><th class="r">إجمالي</th><th class="r">متبقي</th></tr></thead><tbody>
          ${partyList.map(p => `<tr><td>${esc(p.name)}</td><td class="r">${p.count}</td><td class="r">${fmtMoney(p.total, db.settings.currency)}</td><td class="r">${fmtMoney(p.due, db.settings.currency)}</td></tr>`).join('')}
        </tbody></table>` : '<p style="color:var(--text-muted);font-size:13px">لا توجد بيانات</p>'}
      </div>
      <div style="background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--silver-border)">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">حسب المنتج</h3>
        ${productList.length ? `<table class="data-table"><thead><tr><th>المنتج</th><th class="r">الكمية</th><th class="r">الإيراد</th></tr></thead><tbody>
          ${productList.map(p => `<tr><td>${esc(p.name)}</td><td class="r">${p.qty}</td><td class="r">${fmtMoney(p.revenue, db.settings.currency)}</td></tr>`).join('')}
        </tbody></table>` : '<p style="color:var(--text-muted);font-size:13px">لا توجد بيانات</p>'}
      </div>
    </div>
  `;

  $$('[data-r]').forEach(b => b.addEventListener('click', () => { reportRange = b.dataset.r; renderReports(container); }));
  $$('[data-t]').forEach(b => b.addEventListener('click', () => { reportType = b.dataset.t; renderReports(container); }));
  $('#rep-from')?.addEventListener('change', () => renderReports(container));
  $('#rep-to')?.addEventListener('change', () => renderReports(container));

  $('#exp-pdf').addEventListener('click', () => {
    const s = db.settings;
    const rows = inRange.map(i => `<tr><td>${esc(i.number)}</td><td>${fmtDateShort(i.date)}</td><td>${esc(i.partyName)}</td><td style="text-align:left">${fmtMoney(i.total, s.currency)}</td><td style="text-align:left">${fmtMoney(i.due, s.currency)}</td></tr>`).join('');
    $('#print-area').innerHTML = `
      <div class="invoice-print">
        <div class="ip-header"><div class="ip-shop"><h1>${esc(s.shopName)}</h1><p>${esc(s.phone || '')} · ${esc(s.address || '')}</p></div>
        <div class="ip-meta"><strong>تقرير ${reportType === 'sale' ? 'المبيعات' : 'المشتريات'}</strong><div>${label}</div><div>${from} → ${to}</div></div></div>
        <div class="ip-party">
          <strong>الإجمالي:</strong> ${fmtMoney(total, s.currency)} · <strong>المدفوع:</strong> ${fmtMoney(paid, s.currency)} · <strong>المتبقي:</strong> ${fmtMoney(due, s.currency)} · <strong>الضريبة:</strong> ${fmtMoney(tax, s.currency)}
        </div>
        <table><thead><tr><th>الرقم</th><th>التاريخ</th><th>الطرف</th><th style="text-align:left">الإجمالي</th><th style="text-align:left">المتبقي</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <div class="ip-footer">${esc(s.shopName)} — ${new Date().toLocaleString('ar-MA')}</div>
      </div>`;
    setTimeout(() => window.print(), 300);
  });

  $('#exp-xls').addEventListener('click', () => {
    const data = inRange.map(i => ({ 'الرقم': i.number, 'التاريخ': fmtDateShort(i.date), 'الطرف': i.partyName, 'الإجمالي': i.total, 'المدفوع': i.paid, 'المتبقي': i.due, 'الضريبة': i.tax }));
    if (!data.length) return toast('لا توجد بيانات', 'error');
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تقرير');
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    const blob = new Blob([buf], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `تقرير-${from}-${to}.xlsx`; a.click();
    URL.revokeObjectURL(url);
    toast('تم التصدير');
  });
}

/* ============ Invoice Builder ============ */
function renderInvoiceBuilder(container, type) {
  const isSale = type === 'sale';
  const title = isSale ? 'فاتورة بيع جديدة' : 'فاتورة شراء جديدة';
  const parties = isSale ? db.customers : db.suppliers;
  const partyLabel = isSale ? 'العميل' : 'المورد';
  const products = db.products;

  let items = [{ key: uid(), productId: '', name: '', quantity: 1, price: 0, discount: 0 }];
  let invoiceDiscount = 0;
  let taxRate = db.settings.taxRate || 0;
  let paymentMethod = 'cash';
  let paidAmount = 0;

  container.innerHTML = `
    <div class="page-header">
      <div><h2>${title}</h2><p class="sub">أضف البنود ثم احفظ الفاتورة</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" id="scan-btn">📷 مسح باركود</button>
        <button class="btn btn-outline" id="cancel-btn">إلغاء</button>
        <button class="btn btn-primary" id="save-btn">حفظ</button>
      </div>
    </div>
    <div class="invoice-builder">
      <div>
        <div style="background:var(--white);border-radius:var(--radius-md);padding:16px;border:1px solid var(--silver-border);margin-bottom:16px">
          <div class="form-field"><label>${partyLabel}</label>
            <select id="party-select"><option value="">— اختر ${partyLabel} —</option>
              ${parties.map(p => `<option value="${p.id}">${esc(p.name)}${p.phone ? ' · ' + esc(p.phone) : ''}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="invoice-items-table">
          <table><thead><tr>
            <th style="width:40px">#</th><th>المنتج</th><th style="width:90px">الكمية</th>
            <th style="width:110px">السعر</th><th style="width:100px">خصم</th>
            <th style="width:110px">المجموع</th><th style="width:50px"></th>
          </tr></thead><tbody id="items-body"></tbody></table>
          <div style="padding:12px"><button class="btn btn-outline btn-sm" id="add-item">+ إضافة بند</button></div>
        </div>
      </div>
      <div>
        <div class="invoice-summary">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">الملخص</h3>
          <div class="form-field" style="margin-bottom:12px"><label>خصم الفاتورة</label><input type="number" id="invoice-discount" value="0" min="0" step="0.01"></div>
          <div class="form-field" style="margin-bottom:12px"><label>الضريبة (%)</label><input type="number" id="tax-rate" value="${(taxRate * 100).toFixed(0)}" min="0" max="100" step="0.1"></div>
          <div class="form-field" style="margin-bottom:12px"><label>الدفع</label>
            <select id="payment-method"><option value="cash">نقدي</option><option value="credit">آجل</option></select>
          </div>
          <div class="form-field" style="margin-bottom:12px"><label>المدفوع</label><input type="number" id="paid-amount" value="0" min="0" step="0.01"></div>
          <div class="summary-row"><span>المجموع الفرعي</span><span id="subtotal-val">0</span></div>
          <div class="summary-row"><span>الخصم</span><span id="discount-val">0</span></div>
          <div class="summary-row"><span>الضريبة</span><span id="tax-val">0</span></div>
          <div class="summary-row total"><span>الإجمالي</span><span class="amount" id="total-val">0</span></div>
          <div class="summary-row"><span>المتبقي</span><span id="due-val">0</span></div>
        </div>
      </div>
    </div>
  `;

  const itemsBody = $('#items-body');

  function renderItems() {
    itemsBody.innerHTML = items.map((it, i) => `
      <tr data-key="${it.key}">
        <td>${i + 1}</td>
        <td><input type="text" placeholder="المنتج" value="${esc(it.name)}" data-field="name" list="pl-${it.key}">
          <datalist id="pl-${it.key}">${products.map(p => `<option value="${esc(p.name)}" data-id="${p.id}" data-price="${isSale ? p.sellPrice : p.buyPrice}">`).join('')}</datalist>
        </td>
        <td><input type="number" min="0" step="1" value="${it.quantity}" data-field="quantity"></td>
        <td><input type="number" min="0" step="0.01" value="${it.price}" data-field="price"></td>
        <td><input type="number" min="0" step="0.01" value="${it.discount}" data-field="discount"></td>
        <td style="font-weight:600">${fmtMoney(it.quantity * it.price - it.discount, db.settings.currency)}</td>
        <td><button class="icon-btn" data-remove="${it.key}">✕</button></td>
      </tr>`).join('');

    $$('tr', itemsBody).forEach(tr => {
      const key = tr.dataset.key;
      $$('input', tr).forEach(inp => {
        inp.addEventListener('change', (e) => {
          const item = items.find(x => x.key === key); if (!item) return;
          const f = inp.dataset.field;
          if (f === 'name') {
            item.name = e.target.value;
            const found = products.find(p => p.name === e.target.value);
            if (found) { item.productId = found.id; item.price = isSale ? found.sellPrice : found.buyPrice; tr.querySelector('[data-field="price"]').value = item.price; }
          } else item[f] = parseFloat(e.target.value) || 0;
          updateTotals();
        });
      });
      tr.querySelector('[data-remove]')?.addEventListener('click', () => {
        items = items.filter(x => x.key !== key); renderItems(); updateTotals();
      });
    });
  }

  function calc() {
    const subtotal = items.reduce((s, it) => s + (it.quantity * it.price - it.discount), 0);
    const afterDiscount = Math.max(0, subtotal - invoiceDiscount);
    const tax = afterDiscount * taxRate;
    const total = afterDiscount + tax;
    const due = Math.max(0, total - paidAmount);
    return { subtotal, afterDiscount, tax, total, due };
  }
  function updateTotals() {
    const t = calc();
    $('#subtotal-val').textContent = fmtMoney(t.subtotal, db.settings.currency);
    $('#discount-val').textContent = fmtMoney(invoiceDiscount, db.settings.currency);
    $('#tax-val').textContent = fmtMoney(t.tax, db.settings.currency);
    $('#total-val').textContent = fmtMoney(t.total, db.settings.currency);
    $('#due-val').textContent = fmtMoney(t.due, db.settings.currency);
  }

  $('#add-item').addEventListener('click', () => { items.push({ key: uid(), productId: '', name: '', quantity: 1, price: 0, discount: 0 }); renderItems(); });
  $('#invoice-discount').addEventListener('input', (e) => { invoiceDiscount = parseFloat(e.target.value) || 0; updateTotals(); });
  $('#tax-rate').addEventListener('input', (e) => { taxRate = (parseFloat(e.target.value) || 0) / 100; updateTotals(); });
  $('#paid-amount').addEventListener('input', (e) => { paidAmount = parseFloat(e.target.value) || 0; updateTotals(); });
  $('#payment-method').addEventListener('change', (e) => {
    if (e.target.value === 'cash') { const t = calc(); $('#paid-amount').value = t.total.toFixed(2); paidAmount = t.total; updateTotals(); }
  });
  $('#cancel-btn').addEventListener('click', () => { if (confirm('إلغاء؟')) navigate('home'); });

  $('#scan-btn').addEventListener('click', () => {
    openScanner((code) => {
      const p = products.find(x => x.barcode === code);
      if (!p) return toast('لم يتم العثور على منتج بهذا الباركود', 'error');
      const existing = items.find(x => x.productId === p.id);
      if (existing) existing.quantity++;
      else {
        const emptyItem = items.find(x => !x.productId);
        if (emptyItem) { emptyItem.productId = p.id; emptyItem.name = p.name; emptyItem.price = isSale ? p.sellPrice : p.buyPrice; }
        else items.push({ key: uid(), productId: p.id, name: p.name, quantity: 1, price: isSale ? p.sellPrice : p.buyPrice, discount: 0 });
      }
      renderItems(); updateTotals(); toast('تمت الإضافة: ' + p.name);
    });
  });

  $('#save-btn').addEventListener('click', () => {
    const partyId = $('#party-select').value;
    if (!partyId) return toast('اختر ' + partyLabel, 'error');
    const valid = items.filter(it => it.name && it.productId);
    if (!valid.length) return toast('أضف بندًا', 'error');
    const party = parties.find(p => p.id === partyId);
    const t = calc();
    const sameType = db.invoices.filter(i => i.type === type);
    const prefix = isSale ? 'INV-' : 'PUR-';
    const number = prefix + String(sameType.length + 1).padStart(6, '0');

    const invoice = {
      id: uid(), number, type, date: new Date().toISOString(),
      partyId, partyType: isSale ? 'customer' : 'supplier', partyName: party.name,
      items: valid.map(it => ({ productId: it.productId, name: it.name, quantity: it.quantity, price: it.price, discount: it.discount, total: it.quantity * it.price - it.discount })),
      discount: invoiceDiscount, taxRate,
      subtotal: t.afterDiscount, tax: t.tax, total: t.total,
      paid: paidAmount, due: t.due,
      status: t.due === 0 ? 'paid' : paidAmount > 0 ? 'partial' : 'pending',
      paymentMethod
    };

    invoice.items.forEach(it => {
      const p = db.products.find(x => x.id === it.productId);
      if (p) p.quantity = isSale ? Math.max(0, p.quantity - it.quantity) : p.quantity + it.quantity;
    });
    if (invoice.due > 0) {
      const list = isSale ? db.customers : db.suppliers;
      const pr = list.find(x => x.id === partyId);
      if (pr) pr.balance = (pr.balance || 0) + invoice.due;
    }

    db.invoices.push(invoice); saveDB();
    toast('تم حفظ ' + number);
    openModal(`
      <h3>تم حفظ الفاتورة</h3>
      <p class="hint">${number} · ${fmtMoney(invoice.total, db.settings.currency)}</p>
      <div class="modal-actions" style="flex-direction:column;align-items:stretch">
        <button class="btn btn-gold" id="thermal-print">🖨️ طباعة حرارية</button>
        <button class="btn btn-outline" id="pdf-print">📄 طباعة PDF</button>
        <button class="btn btn-primary" id="new-now">فاتورة جديدة</button>
      </div>
    `);
    $('#thermal-print').addEventListener('click', () => { printThermal(invoice); closeModal(); });
    $('#pdf-print').addEventListener('click', () => { printInvoicePDF(invoice); closeModal(); });
    $('#new-now').addEventListener('click', () => { closeModal(); navigate(isSale ? 'sales' : 'purchases'); });
    setTimeout(() => notifyLowStock(), 500);
  });

  renderItems();
  updateTotals();
}

      </select>

      </select>
    </div>

      <th>الحالة</th><th></th>
    </tr></thead><tbody id="inv-body"></tbody></table></div>
  `;

  function render() {

    if (filter.type) list = list.filter(i => i.type === filter.type);
    if (filter.status) list = list.filter(i => i.status === filter.status);
    if (filter.search) {
      const s = filter.search.toLowerCase();
      list = list.filter(i => i.number.toLowerCase().includes(s) || (i.partyName || '').toLowerCase().includes(s));
    }
    list.sort((a, b) => b.date.localeCompare(a.date));

    const body = $('#inv-body');
    if (!list.length) { body.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">لا توجد فواتير</td></tr>`; return; }
    body.innerHTML = list.map(i => `
      <tr>
        <td><strong>${esc(i.number)}</strong></td>
        <td><span class="badge ${i.type === 'sale' ? 'info' : 'warn'}">${i.type === 'sale' ? 'بيع' : 'شراء'}</span></td>
        <td>${fmtDate(i.date)}</td>
        <td>${esc(i.partyName)}</td>
        <td class="r">${fmtMoney(i.total, db.settings.currency)}</td>
        <td class="r">${fmtMoney(i.paid, db.settings.currency)}</td>
        <td class="r">${fmtMoney(i.due, db.settings.currency)}</td>
        <td><span class="badge ${i.status === 'paid' ? 'ok' : i.status === 'partial' ? 'warn' : 'bad'}">${i.status === 'paid' ? 'مدفوعة' : i.status === 'partial' ? 'جزئية' : 'غير مدفوعة'}</span></td>
        <td style="white-space:nowrap">
          <button class="icon-btn" data-thermal="${i.id}" title="حرارية">🖨️</button>
          <button class="icon-btn" data-pdf="${i.id}" title="PDF">📄</button>
          ${getSession()?.role === 'admin' ? `<button class="icon-btn" data-del="${i.id}" title="حذف">🗑️</button>` : ''}
        </td>
      </tr>
    `).join('');

    $$('[data-thermal]', body).forEach(b => b.addEventListener('click', () => {
      const inv = db.invoices.find(x => x.id === b.dataset.thermal); if (inv) printThermal(inv);
    }));
    $$('[data-pdf]', body).forEach(b => b.addEventListener('click', () => {
      const inv = db.invoices.find(x => x.id === b.dataset.pdf); if (inv) printInvoicePDF(inv);
    }));
    $$('[data-del]', body).forEach(b => b.addEventListener('click', () => {
      if (!confirm('حذف؟ سيتم عكس المخزون والرصيد')) return;
      const inv = db.invoices.find(x => x.id === b.dataset.del); if (!inv) return;
      inv.items.forEach(it => { const p = db.products.find(x => x.id === it.productId); if (p) p.quantity = inv.type === 'sale' ? p.quantity + it.quantity : Math.max(0, p.quantity - it.quantity); });
      if (inv.due > 0) { const list = inv.partyType === 'customer' ? db.customers : db.suppliers; const pr = list.find(x => x.id === inv.partyId); if (pr) pr.balance = Math.max(0, (pr.balance || 0) - inv.due); }
      db.invoices = db.invoices.filter(x => x.id !== inv.id);
      saveDB(); render(); toast('تم الحذف');
    }));
  }

  $('#s-inp').addEventListener('input', (e) => { filter.search = e.target.value; render(); });
  $('#f-type').addEventListener('change', (e) => { filter.type = e.target.value; render(); });
  $('#f-status').addEventListener('change', (e) => { filter.status = e.target.value; render(); });
  render();
}

/* ============ Excel ============ */
function renderExcel(container) {
  container.innerHTML = `
    <div class="page-header"><div><h2>Excel</h2><p class="sub">استيراد وتصدير</p></div></div>
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">تصدير</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:28px">
      <button class="btn btn-outline" data-exp="products">المنتجات</button>
      <button class="btn btn-outline" data-exp="customers">العملاء</button>
      <button class="btn btn-outline" data-exp="suppliers">الموردين</button>
      <button class="btn btn-outline" data-exp="invoices">الفواتير</button>
    </div>
    <h3 style="font-size:16px;font-weight:700;margin:0 0 12px">استيراد</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
      <button class="btn btn-gold" id="template-btn">تنزيل قالب</button>
      <button class="btn btn-gold" id="import-btn">استيراد منتجات</button>
    </div>
    <input type="file" id="file-inp" accept=".xlsx,.xls" hidden>
  `;

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
  }

  $$('[data-exp]').forEach(b => b.addEventListener('click', () => {
    const kind = b.dataset.exp;
    let data, sheetName;
    if (kind === 'products') { data = db.products.map(p => ({ 'الاسم': p.name, 'الباركود': p.barcode || '', 'الفئة': p.category || '', 'سعر الشراء': p.buyPrice, 'سعر البيع': p.sellPrice, 'الكمية': p.quantity, 'حد التنبيه': p.minStock })); sheetName = 'المنتجات'; }
    else if (kind === 'customers') { data = db.customers.map(c => ({ 'الاسم': c.name, 'الهاتف': c.phone || '', 'العنوان': c.address || '', 'الرصيد': c.balance || 0 })); sheetName = 'العملاء'; }
    else if (kind === 'suppliers') { data = db.suppliers.map(s => ({ 'الاسم': s.name, 'الهاتف': s.phone || '', 'العنوان': s.address || '', 'الرصيد': s.balance || 0 })); sheetName = 'الموردون'; }
    else { data = db.invoices.map(i => ({ 'الرقم': i.number, 'النوع': i.type === 'sale' ? 'بيع' : 'شراء', 'التاريخ': fmtDate(i.date), 'الطرف': i.partyName, 'المجموع': i.total, 'المدفوع': i.paid, 'المتبقي': i.due })); sheetName = 'الفواتير'; }
    if (!data.length) return toast('لا توجد بيانات', 'error');
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    downloadBlob(new Blob([buf], { type: 'application/octet-stream' }), sheetName + '.xlsx');
    toast('تم التصدير');
  }));

  $('#template-btn').addEventListener('click', () => {
    const ws = XLSX.utils.aoa_to_sheet([
      ['الاسم', 'الباركود', 'الفئة', 'سعر الشراء', 'سعر البيع', 'الكمية', 'حد التنبيه'],
      ['منتج تجريبي', '6111111111111', 'فئة', 10, 15, 100, 10]
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المنتجات');
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    downloadBlob(new Blob([buf], { type: 'application/octet-stream' }), 'قالب_المنتجات.xlsx');
    toast('تم التنزيل');
  });

  $('#import-btn').addEventListener('click', () => $('#file-inp').click());
  $('#file-inp').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = await f.arrayBuffer();
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      let added = 0, updated = 0;
      rows.forEach(r => {
        if (!r['الاسم']) return;
        const d = {
          name: String(r['الاسم']).trim(), barcode: String(r['الباركود'] || '').trim(),
          category: String(r['الفئة'] || '').trim(), buyPrice: Number(r['سعر الشراء']) || 0,
          sellPrice: Number(r['سعر البيع']) || 0, quantity: Number(r['الكمية']) || 0,
          minStock: Number(r['حد التنبيه']) || 0
        };
        const existing = db.products.find(p => p.barcode && p.barcode === d.barcode);
        if (existing) { Object.assign(existing, d); updated++; } else { db.products.push({ id: uid(), ...d }); added++; }
      });
      saveDB(); toast(`تم الاستيراد: ${added} جديد، ${updated} محدّث`);
      navigate('products');
    } catch (err) { toast('فشل: ' + err.message, 'error'); }
    e.target.value = '';
  });
}

/* ============ Backup ============ */
function renderBackup(container) {
  container.innerHTML = `
    <div class="page-header"><div><h2>النسخ الاحتياطي</h2></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px">
      <div class="stat-card" style="padding:28px;gap:14px">
        <h3 style="font-size:17px;font-weight:700">تصدير</h3>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.7">كل البيانات في JSON</p>
        <button class="btn btn-primary" id="backup-btn" style="align-self:flex-start">⬇️ تنزيل</button>
      </div>
      <div class="stat-card" style="padding:28px;gap:14px">
        <h3 style="font-size:17px;font-weight:700">استعادة</h3>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.7">سيتم الاستبدال</p>
        <button class="btn btn-gold" id="restore-btn" style="align-self:flex-start">⬆️ استعادة</button>
      </div>
    </div>
    <div style="margin-top:24px;max-width:900px">
      <div class="stat-card" style="padding:20px;gap:10px">
        <h3 style="font-size:15px;font-weight:700">إعادة الضبط</h3>
        <p style="font-size:13px;color:var(--text-muted)">إرجاع كل شيء للحالة الأولية</p>
        <button class="btn btn-danger" id="reset-btn" style="align-self:flex-start">إعادة الضبط</button>
      </div>
    </div>
    <input type="file" id="restore-file" accept=".json" hidden>
  `;
  $('#backup-btn').addEventListener('click', () => {
    const backup = { version: 2, exportedAt: new Date().toISOString(), data: db };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `نسخة-الإسراء-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`;
    a.click(); URL.revokeObjectURL(url); toast('تم التنزيل');
  });
  $('#restore-btn').addEventListener('click', () => $('#restore-file').click());
  $('#restore-file').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const backup = JSON.parse(reader.result);
        if (!backup.data) throw new Error('ملف غير صالح');
        if (!confirm(`استعادة من ${new Date(backup.exportedAt).toLocaleString('ar-MA')}؟`)) return;
        db = backup.data; saveDB(); toast('تمت الاستعادة'); setTimeout(() => location.reload(), 500);
      } catch (err) { toast(err.message, 'error'); }
    };
    reader.readAsText(f); e.target.value = '';
  });
  $('#reset-btn').addEventListener('click', () => {
    if (!confirm('إعادة كل البيانات؟')) return;
    localStorage.removeItem(DB_KEY); clearSession(); location.reload();
  });
}

/* ============ Users ============ */
function renderUsers(container) {
  container.innerHTML = `
    <div class="page-header"><div><h2>المستخدمون</h2></div>
      <button class="btn btn-primary" id="add-btn">+ إضافة</button>
    </div>
    <div class="table-wrap"><table class="data-table"><thead><tr>
      <th>اسم المستخدم</th><th>الاسم</th><th>الدور</th><th></th>
    </tr></thead><tbody id="body"></tbody></table></div>
  `;
  function render() {
    $('#body').innerHTML = db.users.map(u => `
      <tr>
        <td><strong>${esc(u.username)}</strong></td>
        <td>${esc(u.displayName)}</td>
        <td><span class="badge ${u.role === 'admin' ? 'info' : 'ok'}">${u.role === 'admin' ? 'مدير' : u.role === 'cashier' ? 'كاشير' : 'مشاهد'}</span></td>
        <td>
          <button class="icon-btn" data-edit="${u.id}">✏️</button>
          ${db.users.length > 1 && u.username !== 'admin' ? `<button class="icon-btn" data-del="${u.id}">🗑️</button>` : ''}
        </td>
      </tr>
    `).join('');
    $$('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(b.dataset.edit)));
    $$('[data-del]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('حذف؟')) return;
      db.users = db.users.filter(x => x.id !== b.dataset.del); saveDB(); render();
    }));
  }
  function openForm(id) {
    const u = id ? db.users.find(x => x.id === id) : null;
    openModal(`
      <h3>${u ? 'تعديل' : 'إضافة'}</h3>
      <form class="form-group" id="uform" style="margin-top:16px">
        <div class="form-field"><label>اسم المستخدم</label><input id="uf-user" required value="${u ? esc(u.username) : ''}" ${u ? 'readonly' : ''}></div>
        <div class="form-field"><label>الاسم</label><input id="uf-name" required value="${u ? esc(u.displayName) : ''}"></div>
        <div class="form-field"><label>الرمز (4 أرقام)</label><input id="uf-pin" inputmode="numeric" maxlength="6" required value="${u ? u.pin : ''}"></div>
        <div class="form-field"><label>الدور</label>
          <select id="uf-role">
            <option value="admin" ${u?.role === 'admin' ? 'selected' : ''}>مدير</option>
            <option value="cashier" ${u?.role === 'cashier' ? 'selected' : ''}>كاشير</option>
            <option value="viewer" ${u?.role === 'viewer' ? 'selected' : ''}>مشاهد</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary">${u ? 'حفظ' : 'إضافة'}</button>
        </div>
      </form>
    `);
    $('#uform').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = { username: $('#uf-user').value.trim(), displayName: $('#uf-name').value.trim(), pin: $('#uf-pin').value.trim(), role: $('#uf-role').value };
      if (!/^\d{4,6}$/.test(data.pin)) return toast('الرمز 4-6 أرقام', 'error');
      if (u) Object.assign(u, data);
      else {
        if (db.users.find(x => x.username === data.username)) return toast('مستخدم', 'error');
        db.users.push({ id: uid(), ...data });
      }
      saveDB(); closeModal(); render(); toast('تم');
    });
  }
  $('#add-btn').addEventListener('click', () => openForm());
  render();
}

/* ============ PWA ============ */
function setupPWA() {
  // manifest ديناميكي
  const manifest = {
    name: 'الإسراء - نقطة بيع',
    short_name: 'الإسراء POS',
    description: 'نظام نقطة بيع متكامل',
    start_url: '.',
    display: 'standalone',
    background_color: '#0A64F0',
    theme_color: '#0A64F0',
    lang: 'ar',
    dir: 'rtl',
    icons: [
      { src: 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0A64F0"/><circle cx="256" cy="200" r="72" fill="none" stroke="#C9A227" stroke-width="20"/><path d="M184 200 L144 340 L368 340 L328 200" fill="none" stroke="#C9A227" stroke-width="20" stroke-linejoin="round"/><circle cx="256" cy="200" r="20" fill="#C9A227"/><text x="256" y="440" font-family="sans-serif" font-size="60" font-weight="800" fill="#fff" text-anchor="middle">الإسراء</text></svg>`), sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
    ]
  };
  const manifestStr = JSON.stringify(manifest);
  const manifestBlob = new Blob([manifestStr], { type: 'application/manifest+json' });
  $('#manifest-link').href = URL.createObjectURL(manifestBlob);

  // service worker inline
  const swCode = `
    const CACHE = 'isra-pos-v2';
    self.addEventListener('install', (e) => {
      self.skipWaiting();
    });
    self.addEventListener('activate', (e) => {
      e.waitUntil(clients.claim());
    });
    self.addEventListener('fetch', (e) => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          if (res.status === 200) {
            const clone = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
          }
          return res;
        }).catch(() => caches.match(e.request)))
      );
    });
  `;
  if ('serviceWorker' in navigator) {
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }
}

/* ============ Keyboard Shortcuts ============ */
document.addEventListener('keydown', (e) => {
  if (!getSession()) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const map = { 'F2': 'sales', 'F3': 'purchases', 'F4': 'products', 'F5': 'invoices', 'F6': 'reports' };
  if (map[e.key]) { e.preventDefault(); navigate(map[e.key]); }
  if (e.key === 'F9') { e.preventDefault(); $('#save-btn')?.click(); }
});

/* ============ Init ============ */
loadDB();
setupPWA();
render();
setTimeout(() => notifyLowStock(), 3000);
setInterval(() => { if (getSession()) notifyLowStock(); }, 3600000); // كل ساعة
</script>
